<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITF Irrigación — V0</title>
</head>
<body>
  <h1>V0 — Prueba técnica</h1>
  <p>Paso 1-2: GitHub Pages sirviendo esta página + Google Sign-In.</p>

  <div id="g_id_onload"
       data-client_id="970817103867-q30tnqqqcc9lhtaamqplbs28nglcj7q3.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <pre id="resultado">Todavía no iniciaste sesión.</pre>

  <button id="btnCheckSession" style="display:none">Probar sessionToken guardado (segunda llamada)</button>

  <div id="bloqueProfile" style="display:none; margin-top:1em;">
    <input id="inputWellId" type="text" placeholder="03-0123" />
    <button id="btnGetProfile">Buscar perfil (V0)</button>
    <pre id="resultadoProfile"></pre>
    <img id="imagenProfile" style="max-width:100%; display:none;" />
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby_fttbCjlZaE7qjhZipqRxvLtdXZV1kCaEjyOeK8UZEJy9VgC5LmAGiyUtVeUZRq1Z/exec';

    async function handleCredentialResponse(response) {
      const payload = JSON.parse(atob(response.credential.split('.')[1]));
      document.getElementById('resultado').textContent =
        'Login en el navegador OK (sin validar aún)\n' +
        'email: ' + payload.email + '\n' +
        'Validando contra el backend...';

      try {
        const backendResponse = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'login', idToken: response.credential })
        });
        const result = await backendResponse.json();
        document.getElementById('resultado').textContent =
          'Respuesta del backend (Apps Script):\n' + JSON.stringify(result, null, 2);

        if (result.status === 'ok' && result.data && result.data.sessionToken) {
          localStorage.setItem('sessionToken', result.data.sessionToken);
          document.getElementById('btnCheckSession').style.display = 'inline-block';
          document.getElementById('bloqueProfile').style.display = 'block';
        }
      } catch (err) {
        document.getElementById('resultado').textContent =
          'Error llamando al backend: ' + err.toString();
      }
    }

    async function checkSession() {
      const sessionToken = localStorage.getItem('sessionToken');
      document.getElementById('resultado').textContent = 'Probando sessionToken guardado en localStorage...';
      try {
        const backendResponse = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'checkSession', sessionToken: sessionToken })
        });
        const result = await backendResponse.json();
        document.getElementById('resultado').textContent =
          'Respuesta de checkSession:\n' + JSON.stringify(result, null, 2);
      } catch (err) {
        document.getElementById('resultado').textContent = 'Error: ' + err.toString();
      }
    }

    document.getElementById('btnCheckSession').addEventListener('click', checkSession);

    async function getProfile() {
      const sessionToken = localStorage.getItem('sessionToken');
      const wellId = document.getElementById('inputWellId').value.trim();
      const resultadoEl = document.getElementById('resultadoProfile');
      const imgEl = document.getElementById('imagenProfile');
      imgEl.style.display = 'none';
      resultadoEl.textContent = 'Buscando ' + wellId + '...';

      const clientStart = performance.now();
      try {
        const backendResponse = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'getProfile', sessionToken: sessionToken, wellId: wellId })
        });
        const result = await backendResponse.json();
        const clientElapsedMs = Math.round(performance.now() - clientStart);

        if (result.status === 'ok') {
          const d = result.data;
          resultadoEl.textContent =
            'OK\n' +
            'wellId: ' + d.wellId + '\n' +
            'mimeType: ' + d.mimeType + '\n' +
            'tamaño original: ' + d.originalSizeBytes + ' bytes (' + (d.originalSizeBytes / 1024 / 1024).toFixed(2) + ' MB)\n' +
            'tamaño base64: ' + d.base64SizeBytes + ' bytes (' + (d.base64SizeBytes / 1024 / 1024).toFixed(2) + ' MB)\n' +
            'tiempo en Apps Script (busqueda+lectura Drive): ' + d.elapsedMsEnDrive + ' ms\n' +
            'tiempo total ida y vuelta (cliente): ' + clientElapsedMs + ' ms';
          imgEl.src = 'data:' + d.mimeType + ';base64,' + d.imageBase64;
          imgEl.style.display = 'block';
        } else {
          resultadoEl.textContent =
            'Error\n' + 'code: ' + result.code + '\n' + 'tiempo total: ' + clientElapsedMs + ' ms' +
            (result.debug ? '\ndebug: ' + result.debug : '');
        }
      } catch (err) {
        resultadoEl.textContent = 'Error de red: ' + err.toString();
      }
    }

    document.getElementById('btnGetProfile').addEventListener('click', getProfile);
  </script>
</body>
</html>
