<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Pozos - DGI</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#0b5a7a">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="screen-loading" class="screen">
    <p>Cargando...</p>
  </div>

  <div id="screen-login" class="screen" hidden>
    <div class="logo-mark logo-mark-lg" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3C12 3 5 11 5 15.5C5 19.09 8.13 22 12 22C15.87 22 19 19.09 19 15.5C19 11 12 3 12 3Z" stroke="currentColor" stroke-width="1.6"/></svg>
    </div>
    <p class="eyebrow">Departamento General de Irrigación</p>
    <h1>Consulta de Pozos</h1>
    <p class="subtitle">Ingresá con tu cuenta institucional</p>

    <div id="google-signin-button"></div>

    <p id="login-error" class="error-message" hidden></p>
  </div>

  <div id="screen-main" class="screen" hidden>
    <header>
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3C12 3 5 11 5 15.5C5 19.09 8.13 22 12 22C15.87 22 19 19.09 19 15.5C19 11 12 3 12 3Z" stroke="currentColor" stroke-width="2"/></svg>
      </div>
      <span class="app-name">Consulta de Pozos</span>
      <span id="user-email"></span>
      <button id="btn-logout" class="button-link">Salir</button>
    </header>

    <p class="search-label">Número de pozo</p>
    <form id="search-form">
      <div class="input-wrapper">
        <input id="input-well-id" type="text" placeholder="DD-PPPP" inputmode="numeric" autocomplete="off" />
        <button type="button" id="btn-clear-well-id" class="clear-button" aria-label="Limpiar pozo" hidden>&times;</button>
      </div>
      <button type="submit">Buscar</button>
    </form>
    <p id="input-error" class="error-message" hidden></p>

    <div id="result-area"></div>
  </div>

  <div id="screen-disabled" class="screen" hidden>
    <p>Tu cuenta no tiene acceso habilitado. Contactá al administrador.</p>
    <button id="btn-logout-disabled" class="button-secondary">Cerrar sesión</button>
  </div>

  <div id="screen-offline" class="screen" hidden>
    <div class="offline-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 8.5C7 5 17 5 21 8.5M6.5 12C9 10 15 10 17.5 12M9.5 15.5C10.7 14.6 13.3 14.6 14.5 15.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 4L20 20" stroke="var(--color-accent)" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>
    <p id="offline-message">No tenés conexión a internet.</p>
    <button type="button" id="btn-retry-offline" class="button-secondary">Reintentar</button>
  </div>

  <script src="js/wellIdValidator.js"></script>
  <script src="js/errorMessages.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <!-- Sin async/defer, a proposito: tiene que cargar despues de app.js
       para que onGsiLoaded ya exista cuando dispare el onload. -->
  <script src="https://accounts.google.com/gsi/client" onload="onGsiLoaded()"></script>
</body>
</html>
